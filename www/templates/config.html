<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Home - Vertrev</title>
<link rel="stylesheet" href="/static/style.css">

</head>
<body>
  <div class="sidebar">
    <div class="sidebar-header">
        <h2>Vertrev</h2>
        <img src="/static/icons/vertrev-logo.jpeg" alt="Profile Icon" class="logo-icon">
    </div>

    <div class="sidebar-section">
        <p class="section-title">Discover</p>
        <a href="/" class="sidebar-link">
            <img src="/static/icons/home.svg" alt="Home Icon" class="sidebar-icon">
            Home
        </a>
        <a href="/config" class="sidebar-link">
            <img src="/static/icons/settings.svg" alt="Settings Icon" class="sidebar-icon">
            Configuracion
        </a>
        <a href="/wifi" class="sidebar-link">
            <img src="/static/icons/wifi.svg" alt="Wifi Icon" class="sidebar-icon">
            Red wifi
        </a>
    </div>

    <div class="sidebar-section">
        <p class="section-title">Libreria</p>
        <a href="/commands" class="sidebar-link">
            <img src="/static/icons/list.svg" alt="List Icon" class="sidebar-icon">
            Comandos
        </a>
    </div>
    
    <div class="sidebar-footer">
        🌐 <span class="lang-switch">EN / ES</span>
    </div>
</div>

  <div class="main-content">
    
<div class="container">
  <div class="section">
  <h2>Actualizar Firmware</h2>
  <p>Si desea renovar el firmware</p>
  <form method="POST" enctype="multipart/form-data">
    <input type="file" name="firmware">
    <button type="submit">Guardar</button>
  </form>
  </div>

  <div class="section">
  <h2>Configuracion</h2>
  <p>Configure los valores</p>
  <form method="POST">
    <input type="hidden" name="config" value="1">
    <div class="input-group">
    <input type="number" name="rssi" placeholder="RSSI">
    <input type="number" name="mcs" placeholder="MCS">
    <input type="number" name="power" placeholder="Power">
    <input type="number" name="snr" placeholder="SNR">
    </div>
    <button type="submit">Guardar</button>
  </form>
  </div>

  <div class="section">
  <h2>Control dispositivo</h2>
  <p>Opciones</p>
  <form method="POST">
    <div class="button-group">
    <button type="submit" name="action" value="reboot" class="reboot">Reboot</button>
    <button type="submit" name="action" value="default">Default</button>
    </div>
  </form>
  </div>
</div>
  </div>
</body>
</html>
